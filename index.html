<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Face Analyzer</h1>
          <p class="muted small">Runs entirely in your browser. Nothing is uploaded.</p>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-mode="webcam" role="tab">Camera</button>
          <button class="tab" data-mode="upload" role="tab">Upload</button>
        </div>
      </header>

      <!-- Webcam: line up the shot, then capture -->
      <section id="webcam-view" class="view">
        <div class="live-layout">
          <div class="frame mirrored-frame">
            <video id="video" playsinline muted></video>
            <canvas id="live-overlay"></canvas>
            <div id="face-guide" hidden>
              <div class="oval"></div>
              <div class="guide-label">
                <span id="guide-text">Center your face in the oval</span>
                <div class="hold"><div id="hold-bar"></div></div>
              </div>
            </div>
            <div id="flash" hidden></div>
            <div id="cam-placeholder">
              <button id="start-cam" class="primary">Start camera</button>
            </div>
          </div>

          <aside class="panel">
            <h3>Before capture</h3>
            <p class="muted small">Each item should be checked for an accurate reading.</p>
            <ul id="checklist"><li class="muted">Start the camera to begin</li></ul>
            <label class="toggle"><input type="checkbox" id="auto-capture" checked /> Capture automatically when ready</label>
            <button id="capture" class="primary" disabled>Capture</button>
          </aside>
        </div>
      </section>

      <!-- Upload -->
      <section id="upload-view" class="view" hidden>
        <label id="dropzone">
          <input type="file" id="file" accept="image/*" hidden />
          <strong>Drop a photo here</strong> or click to choose one
          <span class="muted">Straight-on, eye level, neutral face, even lighting, hair off your forehead</span>
        </label>
      </section>

      <!-- Full results -->
      <section id="result-view" class="view" hidden>
        <div class="result-layout">
          <div>
            <div class="frame"><canvas id="result-canvas"></canvas></div>
            <div id="legend" class="legend"></div>
            <div class="controls">
              <button id="retake">Try again</button>
              <label class="toggle"><input type="checkbox" id="show-mesh" /> Show mesh</label>
            </div>
          </div>
          <div id="report"></div>
        </div>
      </section>

      <p id="status" class="muted">Loading face model…</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
